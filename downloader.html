<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Downloader</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .font-syne { font-family: 'Syne', sans-serif; }

    .white-btn {
      background: #ffffff;
      color: #000000;
      transition: all 0.2s ease;
    }

    .white-btn:hover {
      background: #e5e7eb;
      transform: translateY(-1px);
    }

    .app-tile {
      background: #0a0a0a;
      border: 1px solid #262626;
      border-radius: 1.5rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .input-box {
      background: #000000;
      color: #ffffff;
      border: 1px solid #333333;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-box:focus {
      border-color: #ffffff;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #000000; }
    ::-webkit-scrollbar-thumb { background: #333333; border-radius: 10px; }
  </style>
</head>

<body class="flex flex-col min-h-screen relative antialiased">

  <header class="sticky top-0 z-40 bg-black/90 border-b border-zinc-800 px-5 py-3 backdrop-blur-md">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <h1 class="text-base font-extrabold font-syne text-white tracking-wide">
        Downloader
      </h1>
    </div>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto p-4 sm:p-6 flex flex-col items-center justify-start gap-5">

    <div class="app-tile w-full p-5 sm:p-6 flex flex-col gap-4">
      
      <div class="text-center">
        <h2 class="text-lg sm:text-xl font-syne font-bold text-white">Extractor de Videos HD</h2>
        <p class="text-[11px] text-zinc-400">Pega un enlace y el video se cargará abajo al instante.</p>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-zinc-300 flex items-center justify-between px-1">
          <span class="flex items-center gap-1.5">
            <i data-lucide="twitter" class="w-4 h-4 text-white"></i> Enlace de X (Twitter)
          </span>
          <span class="text-[9px] bg-zinc-900 text-zinc-300 border border-zinc-800 px-2 py-0.5 rounded-full">HD / MP4</span>
        </label>
        <div class="flex gap-2">
          <input 
            type="url" 
            id="xUrlInput" 
            placeholder="https://x.com/usuario/status/..." 
            class="input-box flex-1 px-4 py-3 rounded-xl text-xs"
            autocomplete="off"
          />
          <button 
            onclick="processXLink()" 
            class="white-btn px-4 py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shrink-0 cursor-pointer"
          >
            <i data-lucide="sparkles" class="w-4 h-4"></i>
            <span>Obtener</span>
          </button>
        </div>
      </div>

      <div class="relative flex items-center justify-center my-1">
        <div class="border-t border-zinc-800 w-full"></div>
        <span class="absolute bg-black text-zinc-400 text-[10px] font-bold px-3 py-0.5 rounded-full border border-zinc-800">
          O TAMBIÉN
        </span>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-zinc-300 flex items-center justify-between px-1">
          <span class="flex items-center gap-1.5">
            <i data-lucide="video" class="w-4 h-4 text-white"></i> Enlace de TikTok
          </span>
          <span class="text-[9px] bg-zinc-900 text-zinc-300 border border-zinc-800 px-2 py-0.5 rounded-full">Sin Marca de Agua</span>
        </label>
        <div class="flex gap-2">
          <input 
            type="url" 
            id="tiktokUrlInput" 
            placeholder="https://vt.tiktok.com/... o tiktok.com/@user/video/..." 
            class="input-box flex-1 px-4 py-3 rounded-xl text-xs"
            autocomplete="off"
          />
          <button 
            onclick="processTikTokLink()" 
            class="white-btn px-4 py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shrink-0 cursor-pointer"
          >
            <i data-lucide="download-cloud" class="w-4 h-4"></i>
            <span>Obtener</span>
          </button>
        </div>
      </div>

      <div id="statusContainer" class="hidden text-center py-2">
        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-200 text-xs font-bold animate-pulse">
          <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-white"></i>
          <span id="statusText">Procesando contenido...</span>
        </div>
      </div>

      <div id="errorBox" class="hidden p-3 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 text-xs font-bold text-center"></div>

    </div>

    <div id="resultCard" class="hidden app-tile w-full p-5 sm:p-6 flex flex-col items-center gap-4">
      
      <div class="w-full flex items-center justify-between border-b border-zinc-800 pb-3">
        <span id="platformBadge" class="px-3 py-1 rounded-full text-xs font-bold bg-white text-black shadow flex items-center gap-1.5">
          <i data-lucide="film" class="w-3.5 h-3.5"></i> <span id="badgeText">TikTok</span>
        </span>
        <span id="videoAuthor" class="text-xs font-bold text-zinc-400 truncate max-w-[200px]">@usuario</span>
      </div>

      <div class="w-full relative bg-black rounded-2xl overflow-hidden border border-zinc-800 flex items-center justify-center min-h-[220px] max-h-[440px]">
        <video 
          id="previewVideoPlayer" 
          controls 
          playsinline
          preload="metadata"
          class="w-full max-h-[420px] rounded-2xl object-contain"
        ></video>
        <img 
          id="previewImagePlayer" 
          src="" 
          alt="Vista previa" 
          class="hidden w-full max-h-[420px] rounded-2xl object-contain"
        />
      </div>

      <p id="videoTitle" class="text-xs font-semibold text-zinc-300 text-center line-clamp-2 px-2">
        Descripción del video
      </p>

      <div class="w-full flex flex-col sm:flex-row gap-2.5 pt-2">
        <a 
          id="btnDownloadVideo" 
          href="#" 
          target="_blank" 
          class="white-btn flex-1 py-3 px-4 rounded-xl font-bold text-xs flex items-center justify-center gap-2 text-center"
        >
          <i data-lucide="download" class="w-4 h-4"></i>
          <span id="btnVideoLabel">Descargar Video MP4</span>
        </a>

        <a 
          id="btnDownloadAudio" 
          href="#" 
          target="_blank" 
          class="hidden bg-zinc-900 hover:bg-zinc-800 text-white font-bold py-3 px-4 rounded-xl transition text-xs flex items-center justify-center gap-2 text-center border border-zinc-800"
        >
          <i data-lucide="music" class="w-4 h-4 text-white"></i>
          <span>Solo Audio (MP3)</span>
        </a>
      </div>

    </div>

  </main>

  <footer class="py-4 text-center border-t border-zinc-900 bg-black">
    <p class="text-[11px] font-bold text-zinc-500 tracking-wider">Downloader</p>
  </footer>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });

    function showStatus(text) {
      document.getElementById('statusText').innerText = text;
      document.getElementById('statusContainer').classList.remove('hidden');
      document.getElementById('errorBox').classList.add('hidden');
    }

    function hideStatus() {
      document.getElementById('statusContainer').classList.add('hidden');
    }

    function showError(msg) {
      hideStatus();
      const errBox = document.getElementById('errorBox');
      errBox.innerText = msg;
      errBox.classList.remove('hidden');
    }

    async function processXLink() {
      const input = document.getElementById('xUrlInput');
      const url = input.value.trim();
      if (!url) return showError("Pega un enlace válido de X (Twitter)");

      document.getElementById('tiktokUrlInput').value = '';
      showStatus("Obteniendo video de X...");

      try {
        const data = await fetchXVideo(url);
        renderMediaResult(data);
      } catch (err) {
        showError(err.message || "Error al procesar el enlace de X.");
      } finally {
        hideStatus();
      }
    }

    async function processTikTokLink() {
      const input = document.getElementById('tiktokUrlInput');
      const url = input.value.trim();
      if (!url) return showError("Pega un enlace válido de TikTok");

      document.getElementById('xUrlInput').value = '';
      showStatus("Obteniendo video de TikTok...");

      try {
        const data = await fetchTikTokVideo(url);
        renderMediaResult(data);
      } catch (err) {
        showError(err.message || "Error al procesar el enlace de TikTok.");
      } finally {
        hideStatus();
      }
    }

    async function fetchTikTokVideo(cleanUrl) {
      try {
        const formData = new FormData();
        formData.append('url', cleanUrl);
        formData.append('hd', '1');
        const res = await fetch('https://www.tikwm.com/api/', { method: 'POST', body: formData });
        const json = await res.json();
        if (json && json.code === 0 && json.data) {
          const d = json.data;
          return {
            platform: 'TikTok',
            title: d.title || 'Video de TikTok',
            author: d.author ? `@${d.author.unique_id || d.author.nickname}` : '@tiktok',
            videoUrl: d.play || d.wmplay,
            audioUrl: d.music || null,
            type: 'video'
          };
        }
      } catch (e) { console.warn("TikWM POST Falló", e); }

      try {
        const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(cleanUrl)}`);
        const json = await res.json();
        if (json && json.code === 0 && json.data) {
          const d = json.data;
          return {
            platform: 'TikTok',
            title: d.title || 'Video de TikTok',
            author: d.author ? `@${d.author.unique_id || d.author.nickname}` : '@tiktok',
            videoUrl: d.play || d.wmplay,
            audioUrl: d.music || null,
            type: 'video'
          };
        }
      } catch (e) { console.warn("TikWM GET Falló", e); }

      try {
        const res = await fetch(`https://api.tiklydown.eu.org/api/download?url=${encodeURIComponent(cleanUrl)}`);
        const json = await res.json();
        if (json && (json.video || json.url)) {
          return {
            platform: 'TikTok',
            title: json.title || 'Video de TikTok',
            author: json.author ? `@${json.author.unique_id}` : '@tiktok',
            videoUrl: json.video ? (json.video.noWatermark || json.video.watermark) : json.url,
            audioUrl: json.music ? json.music.play_url : null,
            type: 'video'
          };
        }
      } catch (e) { console.warn("Tiklydown Falló", e); }

      try {
        const res = await fetch('https://api.cobalt.tools/api/json', {
          method: 'POST',
          headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: cleanUrl, videoQuality: 'max' })
        });
        const json = await res.json();
        if (json && json.url) {
          return {
            platform: 'TikTok',
            title: json.filename || 'Video de TikTok',
            author: '@tiktok',
            videoUrl: json.url,
            audioUrl: null,
            type: 'video'
          };
        }
      } catch (e) { console.warn("Cobalt Falló", e); }

      throw new Error("No se pudo obtener el video de TikTok. Revisa que el enlace sea público.");
    }

    async function fetchXVideo(cleanUrl) {
      try {
        const match = cleanUrl.match(/status\/(\d+)/);
        if (match) {
          const tweetId = match[1];
          const res = await fetch(`https://api.fxtwitter.com/status/${tweetId}`);
          const json = await res.json();
          if (json && json.tweet && json.tweet.media) {
            const m = json.tweet.media;
            if (m.videos && m.videos.length > 0) {
              return {
                platform: 'X (Twitter)',
                title: json.tweet.text || 'Video de X',
                author: `@${json.tweet.author.screen_name}`,
                videoUrl: m.videos[0].url,
                audioUrl: null,
                type: 'video'
              };
            } else if (m.photos && m.photos.length > 0) {
              return {
                platform: 'X (Twitter)',
                title: json.tweet.text || 'Imagen de X',
                author: `@${json.tweet.author.screen_name}`,
                videoUrl: m.photos[0].url,
                audioUrl: null,
                type: 'image'
              };
            }
          }
        }
      } catch (e) { console.warn("FxTwitter Falló", e); }

      try {
        const res = await fetch('https://api.cobalt.tools/api/json', {
          method: 'POST',
          headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: cleanUrl, videoQuality: 'max' })
        });
        const json = await res.json();
        if (json && json.url) {
          return {
            platform: 'X (Twitter)',
            title: 'Publicación de X',
            author: '@x',
            videoUrl: json.url,
            audioUrl: null,
            type: 'video'
          };
        }
      } catch (e) { console.warn("Cobalt X Falló", e); }

      throw new Error("No se pudo obtener el contenido de X/Twitter.");
    }

    function renderMediaResult(data) {
      const resultCard = document.getElementById('resultCard');
      const badgeText = document.getElementById('badgeText');
      const videoAuthor = document.getElementById('videoAuthor');
      const videoTitle = document.getElementById('videoTitle');
      
      const videoPlayer = document.getElementById('previewVideoPlayer');
      const imagePlayer = document.getElementById('previewImagePlayer');
      const btnDownloadVideo = document.getElementById('btnDownloadVideo');
      const btnDownloadAudio = document.getElementById('btnDownloadAudio');
      const btnVideoLabel = document.getElementById('btnVideoLabel');

      badgeText.innerText = data.platform;
      videoAuthor.innerText = data.author;
      videoTitle.innerText = data.title;

      if (data.type === 'image') {
        videoPlayer.pause();
        videoPlayer.classList.add('hidden');
        imagePlayer.src = data.videoUrl;
        imagePlayer.classList.remove('hidden');
        btnVideoLabel.innerText = "Descargar Imagen HD";
      } else {
        imagePlayer.classList.add('hidden');
        videoPlayer.src = data.videoUrl;
        videoPlayer.classList.remove('hidden');
        videoPlayer.load();
        btnVideoLabel.innerText = "Descargar Video MP4";
      }

      btnDownloadVideo.href = data.videoUrl;
      btnDownloadVideo.onclick = (e) => downloadDirectBlob(e, data.videoUrl, `${data.platform}_media`);

      if (data.audioUrl) {
        btnDownloadAudio.href = data.audioUrl;
        btnDownloadAudio.onclick = (e) => downloadDirectBlob(e, data.audioUrl, `${data.platform}_audio.mp3`);
        btnDownloadAudio.classList.remove('hidden');
      } else {
        btnDownloadAudio.classList.add('hidden');
      }

      resultCard.classList.remove('hidden');
      resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    async function downloadDirectBlob(e, fileUrl, filename) {
      e.preventDefault();
      try {
        const resp = await fetch(fileUrl);
        if (!resp.ok) throw new Error();
        const blob = await resp.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename || 'descarga';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
      } catch (err) {
        window.open(fileUrl, '_blank');
      }
    }
  </script>
</body>
</html>
