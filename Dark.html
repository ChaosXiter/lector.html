<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TikTok Profile Viewer</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .font-syne { font-family: 'Syne', sans-serif; }

    .white-btn {
      background: #ffffff;
      color: #000000;
      transition: all 0.2s ease;
    }

    .white-btn:hover {
      background: #e5e7eb;
      transform: translateY(-1px);
    }

    .app-tile {
      background: #0a0a0a;
      border: 1px solid #262626;
      border-radius: 1.5rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .input-box {
      background: #000000;
      color: #ffffff;
      border: 1px solid #333333;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-box:focus {
      border-color: #ffffff;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #000000; }
    ::-webkit-scrollbar-thumb { background: #333333; border-radius: 10px; }
  </style>
</head>

<body class="flex flex-col min-h-screen relative antialiased">

  <header class="sticky top-0 z-40 bg-black/90 border-b border-zinc-800 px-5 py-3 backdrop-blur-md">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <h1 class="text-base font-extrabold font-syne text-white tracking-wide">
        TikTok Viewer
      </h1>
    </div>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto p-4 sm:p-6 flex flex-col items-center justify-start gap-5">

    <div class="app-tile w-full p-5 sm:p-6 flex flex-col gap-4">
      <div class="text-center">
        <h2 class="text-lg sm:text-xl font-syne font-bold text-white">Buscar Perfil</h2>
        <p class="text-[11px] text-zinc-400">Ingresa el usuario (con o sin @)</p>
      </div>

      <div class="flex gap-2">
        <input 
          type="text" 
          id="usernameInput" 
          placeholder="Ej: charliamelio" 
          class="input-box flex-1 px-4 py-3 rounded-xl text-xs"
          autocomplete="off"
        />
        <button 
          onclick="searchProfile()" 
          class="white-btn px-5 py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shrink-0 cursor-pointer"
        >
          <i data-lucide="search" class="w-4 h-4"></i>
          <span>Ver</span>
        </button>
      </div>

      <div id="statusContainer" class="hidden text-center py-2">
        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-200 text-xs font-bold animate-pulse">
          <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-white"></i>
          <span id="statusText">Buscando perfil...</span>
        </div>
      </div>

      <div id="errorBox" class="hidden p-3 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 text-xs font-bold text-center"></div>
    </div>

    <div id="profileContainer" class="hidden w-full flex flex-col gap-5">
      
      <div class="app-tile w-full p-5 sm:p-6 flex flex-col items-center text-center gap-4">
        <img id="userAvatar" src="" alt="Avatar" class="w-20 h-20 rounded-full border-2 border-zinc-700 object-cover shadow-lg">
        <div>
          <h3 id="userNickname" class="text-base font-bold font-syne text-white">Nombre</h3>
          <p id="userHandle" class="text-xs text-zinc-400">@usuario</p>
        </div>
        <p id="userBio" class="text-xs text-zinc-300 max-w-md px-2 whitespace-pre-line"></p>

        <div class="grid grid-cols-3 gap-2 w-full pt-2 border-t border-zinc-800 text-center">
          <div class="bg-zinc-900/60 p-2.5 rounded-xl border border-zinc-800/80">
            <span id="statFollowing" class="block text-xs sm:text-sm font-bold text-white">0</span>
            <span class="text-[10px] text-zinc-400">Siguiendo</span>
          </div>
          <div class="bg-zinc-900/60 p-2.5 rounded-xl border border-zinc-800/80">
            <span id="statFollowers" class="block text-xs sm:text-sm font-bold text-white">0</span>
            <span class="text-[10px] text-zinc-400">Seguidores</span>
          </div>
          <div class="bg-zinc-900/60 p-2.5 rounded-xl border border-zinc-800/80">
            <span id="statLikes" class="block text-xs sm:text-sm font-bold text-white">0</span>
            <span class="text-[10px] text-zinc-400">Me gusta</span>
          </div>
        </div>
      </div>

      <div class="w-full flex items-center justify-between px-1">
        <h3 class="text-xs font-extrabold text-zinc-300 font-syne tracking-wide flex items-center gap-1.5">
          <i data-lucide="grid" class="w-4 h-4 text-white"></i> Publicaciones Recientes
        </h3>
      </div>

      <div id="postsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>

    </div>

  </main>

  <footer class="py-4 text-center border-t border-zinc-900 bg-black">
    <p class="text-[11px] font-bold text-zinc-500 tracking-wider">TikTok Viewer</p>
  </footer>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });

    function showStatus(text) {
      document.getElementById('statusText').innerText = text;
      document.getElementById('statusContainer').classList.remove('hidden');
      document.getElementById('errorBox').classList.add('hidden');
    }

    function hideStatus() {
      document.getElementById('statusContainer').classList.add('hidden');
    }

    function showError(msg) {
      hideStatus();
      const errBox = document.getElementById('errorBox');
      errBox.innerText = msg;
      errBox.classList.remove('hidden');
      document.getElementById('profileContainer').classList.add('hidden');
    }

    function formatNumber(num) {
      if (!num) return '0';
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toLocaleString();
    }

    async function searchProfile() {
      const input = document.getElementById('usernameInput');
      let username = input.value.trim().replace('@', '');
      if (!username) return showError("Ingresa un nombre de usuario válido.");

      showStatus("Consultando perfil en tiempo real...");

      try {
        const data = await fetchTikTokProfileData(username);
        renderProfile(data);
      } catch (err) {
        showError(err.message || "No se pudo cargar el perfil. Verifica que la cuenta sea pública.");
      } finally {
        hideStatus();
      }
    }

    async function fetchTikTokProfileData(username) {
      let data = null;

      try {
        const res = await fetch(`https://www.tikwm.com/api/user/posts?unique_id=@${username}&count=12`);
        const json = await res.json();
        if (json && json.code === 0 && json.data) {
          data = json.data;
        }
      } catch (e) { console.warn("TikWM user API error", e); }

      if (!data) {
        try {
          const res = await fetch(`https://www.tikwm.com/api/?url=https://www.tiktok.com/@${username}`);
          const json = await res.json();
          if (json && json.code === 0 && json.data) {
            return {
              userInfo: json.data.author,
              videos: [json.data]
            };
          }
        } catch (e) { console.warn("TikWM fallback error", e); }
      }

      if (data && data.videos) {
        return {
          userInfo: data.videos.length > 0 && data.videos[0].author ? data.videos[0].author : {
            nickname: username,
            unique_id: username,
            avatar: '',
            signature: '',
            following: 0,
            follower: 0,
            heart: 0
          },
          videos: data.videos
        };
      }

      throw new Error("Cuenta no encontrada o protegida.");
    }

    function renderProfile(data) {
      const info = data.userInfo || {};
      const videos = data.videos || [];

      document.getElementById('userAvatar').src = info.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80';
      document.getElementById('userNickname').innerText = info.nickname || info.unique_id || 'Usuario';
      document.getElementById('userHandle').innerText = `@${info.unique_id || 'tiktok'}`;
      document.getElementById('userBio').innerText = info.signature || info.bio || 'Sin biografía disponible.';

      document.getElementById('statFollowing').innerText = formatNumber(info.following || info.followingCount || 0);
      document.getElementById('statFollowers').innerText = formatNumber(info.follower || info.followerCount || 0);
      document.getElementById('statLikes').innerText = formatNumber(info.heart || info.heartCount || 0);

      const grid = document.getElementById('postsGrid');
      grid.innerHTML = '';

      if (videos.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center text-xs text-zinc-500 py-4">No hay publicaciones recientes visibles.</div>`;
      } else {
        videos.forEach(v => {
          const coverImg = v.cover || v.origin_cover || v.dynamic_cover || '';
          const desc = v.title || 'Video de TikTok';
          const playCount = v.play_count || v.stats?.playCount || 0;
          const videoLink = v.play || v.url || '#';

          const card = document.createElement('div');
          card.className = 'relative aspect-[9/16] rounded-2xl overflow-hidden bg-zinc-900 border border-zinc-800 group';
          card.innerHTML = `
            <img src="${coverImg}" alt="Post cover" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent flex flex-col justify-end p-2.5">
              <span class="text-[10px] text-white font-bold flex items-center gap-1 drop-shadow">
                <i data-lucide="play" class="w-3 h-3 fill-white"></i> ${formatNumber(playCount)}
              </span>
              <p class="text-[10px] text-zinc-300 truncate mt-0.5">${desc}</p>
            </div>
          `;
          card.onclick = () => {
            if (videoLink !== '#') window.open(videoLink, '_blank');
          };
          grid.appendChild(card);
        });
      }

      document.getElementById('profileContainer').classList.remove('hidden');
      document.getElementById('profileContainer').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      lucide.createIcons();
    }
  </script>
</body>
</html>
